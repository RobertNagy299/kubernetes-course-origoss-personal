apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello          # the Pods this Deployment counts as its own
  template:               # the Pod to stamp out, replicas times
    metadata:
      labels:
        app: hello        # must match the selector above
    spec:
      containers:
        - name: hello
          image: hello:0.1.1
          ports:
            - containerPort: 8080
          resources: 
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              memory: 62Mi
          startupProbe:           # until this passes, the other two wait
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 1
            failureThreshold: 10
          readinessProbe:         # failing: no traffic from the Service
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:          # failing: the container is restarted
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          
